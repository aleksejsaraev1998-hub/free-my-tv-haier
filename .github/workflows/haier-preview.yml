name: Haier Android TV 32-bit preview
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/haier-preview.yml'
      - 'tools/**'
permissions:
  contents: read
jobs:
  build:
    name: Preview (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, lite, bento]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: kit
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: simbasjungles/free-my-tv
          ref: aa34335d25fa2224053d1bb16851e4522a6bbeb0
          path: source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install isolated SDK 34
        shell: bash
        run: |
          set -euo pipefail
          # Accept the licenses without hiding sdkmanager's exit status behind yes/SIGPIPE.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/haier-sdk" 'build-tools;34.0.0' 'platforms;android-34' <<<'y'
          echo "ANDROID_HOME=$RUNNER_TEMP/haier-sdk" >> "$GITHUB_ENV"
      - name: Prepare preview and check sources
        run: |
          python3 kit/tools/test_bento_layout.py
          python3 kit/tools/prepare_preview.py source --profile '${{ matrix.profile }}'
          cd source
          python3 tools/translate.py --check
          git diff --check
      - name: Build APK
        working-directory: source
        env:
          PREVIEW_SIGNING_KEY: ${{ secrets.HAIER_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PREVIEW_SIGNING_KEY" ]; then
            printf '%s' "$PREVIEW_SIGNING_KEY" | base64 --decode > freemytv.keystore
          fi
          bash build.sh
      - name: Verify preview isolation and compiled APK
        run: python3 kit/tools/verify_preview.py source --profile '${{ matrix.profile }}' --output deliverables
      - name: Package verified APK
        env:
          PROFILE: ${{ matrix.profile }}
        shell: bash
        run: |
          set -euo pipefail
          cp source/FreeMyTV.apk "deliverables/FreeMyTV-Haier-$PROFILE-Preview-universal.apk"
          cd deliverables
          sha256sum *.apk > SHA256SUMS.txt
          echo "Profile: $PROFILE; universal Java/Dex, minSdk 26, targetSdk 33; TV runtime test pending." > COMPATIBILITY.txt
          echo 'Optional HAIER_PREVIEW_KEYSTORE_BASE64 retains signing identity; otherwise each CI run uses a disposable key.' >> COMPATIBILITY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-Haier-${{ matrix.profile }}-Preview-universal
          path: deliverables/
          retention-days: 30
          if-no-files-found: error
