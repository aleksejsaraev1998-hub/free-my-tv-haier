name: Haier reversible Google cleanup checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/disable-haier-google-extras.ps1'
      - 'tests/test-google-cleanup.ps1'
      - '.github/workflows/haier-google-tools.yml'
permissions:
  contents: read
jobs:
  powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Parse and test with mocked ADB on Windows PowerShell 5.1
        shell: powershell
        run: .\tests\test-google-cleanup.ps1
      - name: Parse and test with mocked ADB on PowerShell 7
        shell: pwsh
        run: .\tests\test-google-cleanup.ps1
